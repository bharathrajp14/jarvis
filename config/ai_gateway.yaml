# Br-Jarvis AI backends and gateway routing
#
# Edit this file to add providers, change models, or change route policy.
# API keys are referenced by environment-variable name only; never put secrets here.
# Supported strategies: priority, weighted, round_robin, cost, latency.

cooldown_seconds: 15

backends:
  - id: local_ollama
    provider: ollama
    model: llama3.3
    base_url: http://127.0.0.1:11434/v1
    enabled: true
    priority: 10
    weight: 1
    cost_per_1k_tokens: 0
    latency_ms: 250
    capabilities: [chat, code, reasoning, tools]
    max_context: 32768

  - id: proxy_brain
    provider: openai-compatible
    model: gemini-3.6-flash-high
    base_url: http://localhost:8045/v1
    api_key_env: BRJARVIS_PROXY_API_KEY
    enabled: true
    priority: 20
    weight: 3
    cost_per_1k_tokens: 0
    latency_ms: 700
    capabilities: [chat, code, reasoning, vision, tools, agent]
    max_context: 1048576

  # Example external provider. Uncomment and set OPENAI_API_KEY before enabling.
  # - id: openai
  #   provider: openai
  #   model: gpt-4o-mini
  #   base_url: https://api.openai.com/v1
  #   api_key_env: OPENAI_API_KEY
  #   enabled: false
  #   priority: 30
  #   weight: 1
  #   cost_per_1k_tokens: 0.00015
  #   latency_ms: 900
  #   capabilities: [chat, code, reasoning, vision, tools]

routes:
  default:
    strategy: priority
    backends: [local_ollama, proxy_brain]
    max_fallbacks: 3

  local:
    strategy: priority
    backends: [local_ollama]
    max_fallbacks: 0

  fast:
    strategy: latency
    backends: [local_ollama, proxy_brain]
    required_capabilities: [chat]
    max_fallbacks: 2

  coding:
    strategy: weighted
    backends: [proxy_brain, local_ollama]
    required_capabilities: [code]
    max_fallbacks: 2

  budget:
    strategy: cost
    backends: [local_ollama, proxy_brain]
    max_fallbacks: 3

# config/models.yaml — BR JARVIS Central Model & Proxy Brain Configuration
# Priority: Environment Variables > models.yaml > models.json > Defaults

proxy:
  base_url: "http://localhost:8045/v1"
  api_key_env: "BRJARVIS_PROXY_API_KEY"
  timeout_seconds: 120
  connect_timeout_seconds: 10

privacy:
  # Options: proxy_only, local_only, cloud_allowed
  mode: "proxy_only"
  # Set to true only if direct cloud fallback to Google/Anthropic/OpenAI APIs is permitted
  allow_direct_cloud_fallback: false

routing:
  default_model: "gemini-3.6-flash-high"
  
  # Capability-specific defaults
  capabilities:
    chat: "gemini-3.6-flash-high"
    fast_chat: "gemini-3.1-flash-lite"
    reasoning: "gemini-3.1-pro-high"
    deep_reasoning: "gemini-3.1-pro-high"
    planning: "gemini-3-flash-agent"
    agent: "gemini-3-flash-agent"
    code: "gemini-3.1-pro-high"
    code_review: "gemini-3.1-pro-high"
    vision: "gemini-3.1-flash-image"
    image: "gemini-3.1-flash-image"
    summarization: "gemini-3-flash"
    classification: "gemini-3.1-flash-lite"
    extraction: "gemini-3.1-flash-lite"
    long_context: "gemini-3.6-flash-high"
    low_latency: "gemini-3.1-flash-lite"
    fallback: "gemini-3.6-flash-high"

  # Fallback sequence preference
  fallback_hierarchy:
    - "gemini-3.6-flash-high"
    - "gemini-3.1-pro-high"
    - "gemini-3-flash-agent"
    - "gemini-3-flash"
    - "gemini-2.5-pro"
    - "claude-sonnet-4-6"

complexity_thresholds:
  lite_max: 20
  flash_max: 45
  flash_high_max: 70
  pro_high_max: 90

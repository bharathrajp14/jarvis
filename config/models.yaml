# config/models.yaml — BR JARVIS Central Model & Proxy Brain Configuration
# Calibrated from Live Model Benchmark Probing against http://localhost:8045/v1 (15/24 Verified Online)

proxy:
  base_url: "http://localhost:8045/v1"
  api_key_env: "OPENAI_API_KEY"
  timeout_seconds: 60
  connect_timeout_seconds: 10

privacy:
  mode: "proxy_only"
  allow_direct_cloud_fallback: false

routing:
  default_backend: "gpt"
  default_model: "gemini-3-flash-agent"
  disable_gemini: true
  
  # Capability-specific mappings based on verified live proxy model availability
  capabilities:
    chat: "gemini-3-flash-agent"
    fast_chat: "gemini-3.5-flash-low"
    reasoning: "gemini-3-flash-agent"
    deep_reasoning: "gemini-3-flash-agent"
    planning: "gemini-3-flash-agent"
    agent: "gemini-3-flash-agent"
    pro_agent: "gemini-3-flash-agent"
    code: "gemini-3-flash-agent"
    code_review: "gemini-3-flash"
    vision: "gemini-3.1-flash-image"
    image: "gemini-3.1-flash-image"
    summarization: "gemini-3-flash"
    classification: "gemini-3.5-flash-low"
    extraction: "gemini-3.5-flash-low"
    long_context: "gemini-3-flash-agent"
    low_latency: "gemini-3.5-flash-low"
    voice_live: "gemini-3.6-flash-tiered"
    fallback: "gemini-3-flash"
    gpt_compatible: "gemini-3-flash-agent"

  # Fallback sequence preference of verified online models
  fallback_hierarchy:
    - "gemini-3-flash-agent"
    - "gemini-3-flash"
    - "gemini-3.5-flash-low"
    - "gemini-3.1-flash-image"

complexity_thresholds:
  lite_max: 20
  flash_max: 45
  flash_high_max: 70
  pro_high_max: 90

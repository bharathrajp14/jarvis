# config/models.yaml — BR JARVIS Central Model & Proxy Brain Configuration
# Calibrated from Live Model Benchmark Probing (16/24 Online)

proxy:
  base_url: "http://localhost:8045/v1"
  api_key_env: "OPENAI_API_KEY"
  timeout_seconds: 60
  connect_timeout_seconds: 10

privacy:
  mode: "proxy_only"
  allow_direct_cloud_fallback: true

routing:
  default_model: "gemini-3.6-flash-tiered"
  
  # Capability-specific mappings based on live benchmark results
  capabilities:
    chat: "gemini-3.6-flash-tiered"
    fast_chat: "gemini-3.6-flash-tiered"
    reasoning: "gemini-2.5-pro"
    deep_reasoning: "gemini-2.5-pro"
    planning: "gemini-2.5-pro"
    agent: "gemini-2.5-flash"
    pro_agent: "gemini-2.5-pro"
    code: "gemini-2.5-pro"
    code_review: "gemini-2.5-pro"
    vision: "gemini-2.5-flash"
    image: "gemini-2.5-flash"
    summarization: "gemini-2.5-flash"
    classification: "gemini-2.0-flash"
    extraction: "gemini-2.0-flash"
    long_context: "gemini-2.5-pro"
    low_latency: "gemini-2.5-flash"
    fallback: "gemini-2.5-flash"
    gpt_compatible: "gemini-2.5-flash"

  # Fallback sequence preference of verified online models
  fallback_hierarchy:
    - "gemini-2.5-flash"
    - "gemini-2.5-pro"
    - "gemini-2.0-flash"

complexity_thresholds:
  lite_max: 20
  flash_max: 45
  flash_high_max: 70
  pro_high_max: 90

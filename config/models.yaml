# config/models.yaml — BR JARVIS Central Model & Proxy Brain Configuration
# Calibrated from Live Model Benchmark Probing (16/24 Online)

proxy:
  base_url: "http://localhost:8045/v1"
  api_key_env: "OPENAI_API_KEY"
  timeout_seconds: 60
  connect_timeout_seconds: 10

privacy:
  mode: "proxy_only"
  allow_direct_cloud_fallback: true

routing:
  default_model: "gemini-3.6-flash-tiered"
  
  # Capability-specific mappings based on live benchmark results
  capabilities:
    chat: "gemini-3.6-flash-tiered"
    fast_chat: "gemini-3.6-flash-tiered"
    reasoning: "claude-opus-4-6-thinking"
    deep_reasoning: "claude-opus-4-6-thinking"
    planning: "gemini-3-flash-agent"
    agent: "gemini-3-flash-agent"
    pro_agent: "gemini-pro-agent"
    code: "claude-sonnet-4-6"
    code_review: "claude-sonnet-4-6"
    vision: "gemini-3.1-flash-image"
    image: "gemini-3.1-flash-image"
    summarization: "gemini-3-flash"
    classification: "gemini-3.5-flash-extra-low"
    extraction: "gemini-3.5-flash-extra-low"
    long_context: "gemini-3.6-flash-high"
    low_latency: "gemini-3.6-flash-tiered"
    fallback: "gemini-3.6-flash-medium"
    gpt_compatible: "gpt-oss-120b-medium"

  # Fallback sequence preference of verified online models
  fallback_hierarchy:
    - "gemini-3.6-flash-tiered"
    - "gemini-3.6-flash-high"
    - "gemini-3.6-flash-medium"
    - "gemini-3-flash"
    - "gemini-3-flash-agent"
    - "gemini-pro-agent"
    - "claude-sonnet-4-6"
    - "claude-opus-4-6-thinking"
    - "gemini-2.5-pro"
    - "gpt-oss-120b-medium"

complexity_thresholds:
  lite_max: 20
  flash_max: 45
  flash_high_max: 70
  pro_high_max: 90

# config/models.yaml — BR JARVIS Central Model & Proxy Brain Configuration
# Calibrated from Live Model Benchmark Probing (16/24 Online)

proxy:
  base_url: "http://localhost:8045/v1"
  api_key_env: "OPENAI_API_KEY"
  timeout_seconds: 60
  connect_timeout_seconds: 10

privacy:
  mode: "proxy_only"
  allow_direct_cloud_fallback: true

routing:
  default_model: "gemini-3.1-pro-high"
  
  # Capability-specific mappings based on live proxy model availability
  capabilities:
    chat: "gemini-3.1-pro-high"
    fast_chat: "gemini-3.6-flash-medium"
    reasoning: "gemini-3.1-pro-high"
    deep_reasoning: "gemini-3.1-pro-high"
    planning: "gemini-3.1-pro-high"
    agent: "gemini-3.7-flash-high"
    pro_agent: "gemini-3.1-pro-high"
    code: "gemini-3.1-pro-high"
    code_review: "gemini-3.1-pro-high"
    vision: "gemini-3.1-flash-image"
    image: "gemini-3.1-flash-image"
    summarization: "gemini-3.1-pro-high"
    classification: "gemini-3.6-flash-medium"
    extraction: "gemini-3.6-flash-medium"
    long_context: "gemini-3.1-pro-high"
    low_latency: "gemini-3.6-flash-medium"
    fallback: "gemini-3.1-pro-high"
    gpt_compatible: "gemini-3.1-pro-high"

  # Fallback sequence preference of verified online models
  fallback_hierarchy:
    - "gemini-3.1-pro-high"
    - "gemini-3.7-flash-high"
    - "gemini-3.6-flash-high"
    - "gemini-3.5-flash-high"
    - "gemini-3.1-flash-lite"

complexity_thresholds:
  lite_max: 20
  flash_max: 45
  flash_high_max: 70
  pro_high_max: 90

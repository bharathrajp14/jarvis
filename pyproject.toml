[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brjarvis"
version = "38.5.0"
description = "BRJARVIS — Cognitive Multi-Modal AI Operating System & Autonomous Controller"
readme = "readme.md"
license = {text = "MIT"}
requires-python = ">=3.11, <=3.14"
authors = [
    {name = "Bharath Raj", email = "bharathraj14120@gmail.com"},
]
keywords = [
    "ai-assistant",
    "voice-assistant",
    "python",
    "gemini",
    "local-first",
    "autonomous-agent",
    "desktop-automation"
]

dependencies = [
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "rich>=13.7.0",
    "psutil>=5.9.0",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/bharthraj1412/BrJarvis"
Repository = "https://github.com/bharthraj1412/BrJarvis.git"

[project.optional-dependencies]
voice = [
    "sounddevice>=0.5.0",
    "SpeechRecognition>=3.10.0",
    "edge-tts>=7.0.0",
    "numpy>=1.26.0",
    "faster-whisper>=1.0.0",
]
automation = [
    "pyperclip>=1.8.2",
    "pyautogui>=0.9.54",
    "pillow>=10.0.0",
    "mss>=10.0.0",
    "opencv-python>=4.9.0",
    "PySide6>=6.6.0",
]
web = [
    "duckduckgo-search>=6.0.0",
    "beautifulsoup4>=4.12.0",
    "playwright>=1.44.0",
    "youtube-transcript-api>=0.6.0",
    "websockets>=14.0",
]
documents = [
    "python-docx>=1.1.0",
    "fpdf2>=2.7.0",
    "openpyxl>=3.1.0",
    "pypdf>=4.0.0",
    "PyMuPDF>=1.24.0",
]
memory = [
    "chromadb>=0.5.0",
]
llm-backends = [
    "openai>=1.30.0",
    "anthropic>=0.30.0",
    "mistralai>=2.4.0",
]
windows = [
    "pygetwindow",
    "comtypes",
    "pycaw",
    "win10toast",
    "pywinauto",
    "send2trash",
]
all = [
    "brjarvis[voice,automation,web,documents,memory,llm-backends,windows]",
]
dev = [
    "pytest>=7.0.0",
    "pytest-timeout>=2.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
brjarvis = "brjarvis:main"
jarvis = "brjarvis:main"
jarvis-cli = "main_mk37:main"
jarvis-server = "server:main"

[tool.setuptools.packages.find]
include = [
    "actions*",
    "agent*",
    "backends*",
    "computer*",
    "config*",
    "context*",
    "core*",
    "desktop_ui*",
    "events*",
    "evolution*",
    "guardian*",
    "history*",
    "memory*",
    "multi_agent*",
    "native*",
    "plugins*",
    "reasoning*",
    "redteam*",
    "router*",
    "screen_server*",
    "scripts*",
    "skills*",
    "tools*",
    "vision*",
    "voice*",
    "watchers*",
    "web*",
    "workflow*",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 30

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bharath Raj — AI Engineer</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #000000;
            --secondary: #333333;
            --accent: #000000;
            --text: #111111;
            --muted: #444444;
            --bg: #FFFFFF;
            --card-bg: #F7FAFC;
            --font-heading: 'Arial', 'Helvetica', sans-serif;
            --font-body: 'Arial', 'Helvetica', sans-serif;
            --font-code: 'Share Tech Mono', monospace;
            --font-size: 10pt;
            --line-height: 1.4;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: var(--font-body);
            font-size: var(--font-size);
            line-height: var(--line-height);
            color: var(--text);
            background: #E2E8F0;
            padding: 24px;
        }
        .resume-page {
            max-width: 820px;
            margin: 0 auto;
            background: var(--bg);
            padding: 36pt;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            border-radius: 4px;
        }
        a { color: var(--accent); text-decoration: none; }
        a:hover { text-decoration: underline; }
        .summary-text { font-size: 9.5pt; line-height: 1.5; color: var(--text); }
        .skill-category-row { margin-bottom: 4px; font-size: 9.5pt; }
        .skill-category-name { font-weight: 600; color: var(--primary); margin-right: 6px; }
        .skill-tag { display: inline-block; background: var(--card-bg); color: var(--text); padding: 1px 6px; border-radius: 3px; font-size: 8.5pt; margin: 1px 3px 1px 0; border: 1px solid #E2E8F0; }
        .entry-technologies { font-size: 8.5pt; color: var(--muted); margin-top: 3px; }
        .proj-desc { font-size: 9pt; margin-top: 2px; color: var(--text); }
        
        
            .resume-header { text-align: center; margin-bottom: 16px; }
            .candidate-name { font-size: 20pt; font-weight: bold; text-transform: uppercase; color: #000; }
            .contact-line { font-size: 9.5pt; color: #333; margin-top: 4px; }
            .section-title { font-size: 11pt; font-weight: bold; text-transform: uppercase; border-bottom: 1px solid #000; padding-bottom: 2px; margin: 14px 0 8px; }
            .job-entry, .project-entry { margin-bottom: 10px; }
            .job-header { display: flex; justify-content: space-between; font-weight: bold; font-size: 10pt; }
            .job-sub { display: flex; justify-content: space-between; font-size: 9.5pt; color: #333; }
            .bullet-list { margin: 3px 0 0 16px; padding: 0; }
            .bullet-list li { margin-bottom: 2px; font-size: 9.5pt; line-height: 1.35; }
            .skills-text-line { font-size: 9.5pt; line-height: 1.4; margin-bottom: 3px; }
        

        @media print {
            body { background: #FFFFFF; padding: 0; }
            .resume-page { box-shadow: none; max-width: 100%; border-radius: 0; padding: 36pt; }
            @page { margin: 0; size: letter portrait; }
        }
    </style>
</head>
<body>
    <div class="resume-page">
        <header class="resume-header">
            <h1 class="candidate-name">Bharath Raj</h1>
            <div class="candidate-title">AI Engineer</div>
            <div class="contact-line"><a href="mailto:bharath@example.com">bharath@example.com</a> • <span>+1-555-0199</span></div>
        </header>
        <main class="resume-body">
            
                    <div class="resume-section" id="section-summary">
                        <div class="section-title">Professional Summary</div>
                        <p class="summary-text">Senior AI Systems Engineer</p>
                    </div>
                
        </main>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BR JARVIS — 3D Knowledge Galaxy</title>
  <script src="https://unpkg.com/3d-force-graph"></script>
  <script src="graph-data.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #020408;
      font-family: 'Courier New', monospace;
      color: #8ffcff;
    }
    #3d-graph {
      width: 100vw;
      height: 100vh;
    }
    .hud-title {
      position: absolute;
      top: 16px;
      left: 20px;
      z-index: 10;
      background: rgba(1, 13, 20, 0.85);
      border: 1px solid #0d3347;
      padding: 10px 18px;
      border-radius: 8px;
      box-shadow: 0 0 15px rgba(0, 212, 255, 0.2);
    }
    .hud-title h1 {
      margin: 0;
      font-size: 16px;
      color: #00d4ff;
      letter-spacing: 2px;
    }
    .hud-title p {
      margin: 4px 0 0 0;
      font-size: 11px;
      color: #3a8a9a;
    }
    #side-panel {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 320px;
      max-height: 80vh;
      background: rgba(1, 15, 24, 0.92);
      border: 1px solid #00d4ff;
      border-radius: 8px;
      padding: 16px;
      display: none;
      z-index: 10;
      overflow-y: auto;
      box-shadow: 0 0 25px rgba(0, 212, 255, 0.3);
    }
    #side-panel h2 {
      margin: 0 0 8px 0;
      font-size: 14px;
      color: #00ff88;
    }
    #side-panel .tag {
      display: inline-block;
      padding: 2px 8px;
      background: #001f2e;
      border: 1px solid #007a99;
      color: #00d4ff;
      font-size: 10px;
      border-radius: 4px;
      margin-bottom: 12px;
    }
    #side-panel p {
      font-size: 12px;
      line-height: 1.5;
      color: #d8f8ff;
      white-space: pre-wrap;
    }
    .close-btn {
      float: right;
      cursor: pointer;
      color: #ff3355;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="hud-title">
    <h1>⚡ BR JARVIS — KNOWLEDGE GALAXY</h1>
    <p id="stats-line">Scanning neural nodes...</p>
  </div>

  <div id="side-panel">
    <span class="close-btn" onclick="closePanel()">✕</span>
    <h2 id="panel-title">Node Title</h2>
    <div id="panel-tag" class="tag">folder</div>
    <p id="panel-text">Note excerpt...</p>
  </div>

  <div id="3d-graph"></div>

  <script>
    const data = window.GRAPH || { nodes: [], links: [] };

    document.getElementById('stats-line').innerText =
      `${data.nodes.length} Neural Nodes · Interactive 3D Orbit Active`;

    const Graph = ForceGraph3D()
      (document.getElementById('3d-graph'))
      .graphData(data)
      .nodeLabel('label')
      .nodeAutoColorBy('group')
      .nodeVal(node => 5)
      .linkWidth(1.5)
      .linkColor(() => 'rgba(0, 212, 255, 0.3)')
      .onNodeClick(node => {
        // Fly camera to node
        const distance = 40;
        const distRatio = 1 + distance/Math.hypot(node.x, node.y, node.z);
        Graph.cameraPosition(
          { x: node.x * distRatio, y: node.y * distRatio, z: node.z * distRatio },
          node,
          2000
        );

        // Show side panel
        document.getElementById('panel-title').innerText = node.label;
        document.getElementById('panel-tag').innerText = `GROUP: ${node.group.toUpperCase()}`;
        document.getElementById('panel-text').innerText = node.excerpt;
        document.getElementById('side-panel').style.display = 'block';
      });

    // Slow idle rotation
    let angle = 0;
    setInterval(() => {
      angle += 0.002;
      Graph.cameraPosition({
        x: 180 * Math.sin(angle),
        z: 180 * Math.cos(angle)
      });
    }, 50);

    function closePanel() {
      document.getElementById('side-panel').style.display = 'none';
    }

    // Function to fly to node by ID (called during RAG query response)
    window.flyToNode = function(nodeId) {
      const node = data.nodes.find(n => n.id === nodeId);
      if (node) {
        const distRatio = 1 + 40/Math.hypot(node.x, node.y, node.z);
        Graph.cameraPosition(
          { x: node.x * distRatio, y: node.y * distRatio, z: node.z * distRatio },
          node,
          2000
        );
        document.getElementById('panel-title').innerText = node.label;
        document.getElementById('panel-tag').innerText = `GROUP: ${node.group.toUpperCase()}`;
        document.getElementById('panel-text').innerText = node.excerpt;
        document.getElementById('side-panel').style.display = 'block';
      }
    };
  </script>
</body>
</html>
